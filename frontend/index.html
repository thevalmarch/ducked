<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ducked.dev — The Constrained Canvas</title>
    <meta name="description"
        content="Paste a repo. Watch it live. Watch it die. Ephemeral code execution with brutal constraints.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Load order matters: tokens define the vars every other file consumes,
         responsive.css last so its breakpoints override base layout. -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/watcher.css">
    <link rel="stylesheet" href="/static/css/phase-bar.css">
    <link rel="stylesheet" href="/static/css/terminal.css">
    <link rel="stylesheet" href="/static/css/states.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>

<body>

    <!-- ════════════ STATE 1: IDLE ════════════ -->
    <section id="state-idle" class="state active">
        <div class="watcher" id="watcher" data-watcher-face></div>
        <div class="brand">
            <h1>Ducked</h1>
            <p class="tagline">Paste a repo. Watch it live. Watch it die.</p>
        </div>
        <div class="launcher">
            <div class="input-row">
                <input type="text" id="repo-input" placeholder="https://github.com/user/repo" spellcheck="false"
                    autocomplete="off">
                <button class="btn-deploy" id="btn-deploy">Deploy</button>
            </div>
            <p id="deploy-error"></p>
        </div>
        <div class="constraints">
            <span>CPU: 0.5</span>
            <span>RAM: 256MB</span>
            <span id="constraint-ttl">TTL: 60s</span>
            <span>Net: Isolated</span>
        </div>

    </section>

    <!-- ════════════ STATE 2: BUILDING ════════════ -->
    <section id="state-building" class="state">
        <div class="phase-bar" id="phase-bar">
            <div class="phase-indicator" id="phase-indicator"></div>
            <div class="phase-step clone" id="phase-clone">clone</div>
            <div class="phase-connector"></div>
            <div class="phase-step detect" id="phase-detect">detect</div>
            <div class="phase-connector"></div>
            <div class="phase-step build" id="phase-build">build</div>
            <div class="phase-connector"></div>
            <div class="phase-step run" id="phase-run">run</div>
        </div>
        <div class="terminal-wrap">
            <div class="terminal-header">
                <span>terminal</span>
                <span>—</span>
                <span id="terminal-session-id"></span>
            </div>
            <div class="terminal" id="terminal-build"></div>
        </div>
    </section>

    <!-- ════════════ STATE 3: RUNNING ════════════ -->
    <section id="state-running" class="state">
        <div class="countdown-bar-wrap">
            <div class="countdown-bar" id="countdown-bar"></div>
        </div>
        <div class="countdown-info">
            <div class="status" id="countdown-status">
                <span>● Container alive</span>
            </div>
            <div class="timer" id="countdown-timer">60s remaining</div>
        </div>
        <div class="split-view">
            <div class="panel">
                <div class="panel-header">build log</div>
                <div class="terminal" id="terminal-running"></div>
            </div>
            <div class="panel">
                <div class="panel-header">live preview</div>
                <div class="preview-loading" id="preview-loading">Loading preview...</div>
                <iframe class="preview-frame" id="preview-frame" style="display:none;"></iframe>
            </div>
        </div>
    </section>

    <!-- ════════════ STATE 4: DESTROYED ════════════ -->
    <section id="state-destroyed" class="state">
        <div class="watcher sleeping" data-watcher-face>
            <div class="zzz z1">Z</div>
            <div class="zzz z2">z</div>
            <div class="zzz z3">z</div>
        </div>
        <div class="death-message">
            <h2>Session terminated.</h2>
            <p>Zero traces remain. Quack.</p>
        </div>
        <div class="death-stats">
            <span id="stat-lived">Lived: —</span>
            <span id="stat-built">Built in: —</span>
        </div>
        <button class="btn-deploy" id="btn-reset">Deploy Another</button>
        <details class="log-archive">
            <summary>▸ Build log archive</summary>
            <div class="terminal" id="terminal-archive"></div>
        </details>
    </section>

    <!-- The watcher's face, cloned into every [data-watcher-face] host by
         js/components/watcher.js. Defined once here rather than duplicated
         in the idle and destroyed states. -->
    <template id="watcher-face">
        <div class="watcher-eyes">
            <div class="watcher-eye">
                <div class="watcher-pupil"></div>
            </div>
            <div class="watcher-eye">
                <div class="watcher-pupil"></div>
            </div>
        </div>
        <div class="watcher-beak"></div>
    </template>

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>
